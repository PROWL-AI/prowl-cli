name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite is offline by design: it must pass with no key and no network.
      - run: npm test

  tool-count:
    # Separate from `npm test` because it reaches the network, and a job that
    # sometimes needs the internet inside the unit-test job is a job people learn
    # to re-run rather than read. An unreachable server exits 0 with UNKNOWN.
    name: catalogue count matches prowl.chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check:tools
